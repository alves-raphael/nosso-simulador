name: deploy

env:
  ARTIFACT_NAME: dist-${{ github.run_id }}.tar.gz

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Assets
        run: npm run build

      - name: Prepare Production Artifact
        run: tar -czf "$ARTIFACT_NAME" -C dist .

      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifact
          path: ${{ env.ARTIFACT_NAME }}
          retention-days: 1

  build-deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download Production Artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-artifact
          path: .

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "${{ env.ARTIFACT_NAME }}"
          target: "/var/www/nosso-simulador/releases"

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            ARTIFACT_NAME="${{ env.ARTIFACT_NAME }}"
            RELEASE_DIR=/var/www/nosso-simulador/releases/$(date +%s)

            mkdir -p "$RELEASE_DIR"
            tar -xzf "/var/www/nosso-simulador/releases/$ARTIFACT_NAME" -C "$RELEASE_DIR"
            rm -f "/var/www/nosso-simulador/releases/$ARTIFACT_NAME"

            ln -sfn "$RELEASE_DIR" /var/www/nosso-simulador/current

            sudo systemctl reload nginx
